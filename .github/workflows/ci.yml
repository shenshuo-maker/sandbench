name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unit tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest tests/test_spec.py
      - name: docker bench
        run: |
          docker pull busybox
          python -m pip install -e .
          python -m pytest tests/test_runner.py
          python -m sandbench bench --jobs 8 --concurrency 4 --workload ok
