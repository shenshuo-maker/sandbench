[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbench"
version = "0.1.0"
description = "Isolated container runner plus lifecycle / load bench for interview-grade infra practice."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Shen Shuo" }]

[project.scripts]
sandbench = "sandbench.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
